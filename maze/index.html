<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Maze</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="instructions" role="main">
            <h1>How to Escape</h1>
            <p>You are the yellow square. Your aim is to navigate through the maze and escape by getting to the green square.</p>
            <p>Use the arrow keys to navigate the maze. Go to each of the blue challenge squares to solve six code challenges and escape the maze.</p>
            <p><b>Good luck!</b></p>
        </div>
        <div class="mazeContainer">
            <div class="maze" id="maze"></div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
